name: apk
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.10.2 }
      - run: gradle assembleDebug -Pvc=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: no-for-you-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release (the app updates itself from the latest one)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" app/build/outputs/apk/debug/app-debug.apk \
            --target "${{ github.sha }}" --title "Build ${{ github.run_number }}" \
            --notes "Automatic build ${{ github.run_number }}" --latest
